# Publishes the site to GitHub Pages on every push to main, except pushes that only change Markdown, the
# README's screenshots (images/ipad.jpeg, images/phone.png) or tests. The logo in images/ is part of the site. defaults/ is part of the site (the page fetches it), so it publishes.
name: Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'images/ipad.jpeg'
      - 'images/phone.png'
      - 'tests/**'           # not part of the site (and kept out of git for now)
  workflow_dispatch:        # "Run workflow" in the Actions tab publishes by hand

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
